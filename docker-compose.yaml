services:
  redis:
    image: "redis:latest"
    container_name: wootcord_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    env_file:
      - .env

volumes:
  redis_data:
    name: wootcord_redis_data
